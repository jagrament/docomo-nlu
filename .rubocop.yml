inherit_from:
  - .rubocop.ruby.yml
  - .rubocop.rspec.yml

plugins:
  - rubocop-performance
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.3
  NewCops: disable
  SuggestExtensions: false

Naming/FileName:
  Exclude:
    - "Gemfile"
    - "Rakefile"
    - "lib/docomo-nlu.rb"
RSpec/EmptyExampleGroup:
  Enabled: false
RSpec/SpecFilePathFormat:
  CustomTransform:
    DocomoNlu: docomo_nlu
RSpec/MultipleExpectations:
  Max: 5
RSpec/LeakyConstantDeclaration:
  Enabled: false
RSpec/DescribedClass:
  EnforcedStyle: described_class
# Specs share fixture IDs across examples via block-scoped constants (see RSpec/LeakyConstantDeclaration above).
Lint/ConstantDefinitionInBlock:
  Enabled: false
# These specs only assert on side effects (file upload/download), not return values.
RSpec/NoExpectationExample:
  Enabled: false
